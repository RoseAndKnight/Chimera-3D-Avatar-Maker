<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chimera 3D Avatar Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/page/chimera.svg">
<link rel="stylesheet" href="/page/style.css">
</head>
<body data-view="create">
<header id="topbar">
  <a class="brand" href="/" aria-label="Chimera 3D Avatar Maker">
    <svg class="seal" viewBox="0 0 32 32" aria-hidden="true">
      <path class="s1" d="M24.6 7.9A12 12 0 0 0 9.2 6.1"/>
      <path class="s2" d="M6.3 8.9a12 12 0 0 0 0 14.2"/>
      <path class="s3" d="M9.2 25.9a12 12 0 0 0 15.4-1.8"/>
      <circle cx="16" cy="16" r="2.6"/>
    </svg>
    <span class="name">Chimera</span><span class="tagline">3D Avatar Maker</span>
  </a>
  <nav id="views" aria-label="Views">
    <button data-v="create" data-i="view_create"></button>
    <button data-v="library" data-i="view_library"></button>
    <button data-v="characters" data-i="view_characters"></button>
  </nav>
  <div class="border">
    <span id="counts"></span>
    <button id="language" title="Language"></button>
  </div>
</header>

<!-- Create: choose the parts, see the character, tune the render, assemble -->
<div id="create" class="view">
  <section id="choice">
    <nav id="tabs" aria-label="Categories"></nav>
    <div id="shelf">
      <header>
        <h1 id="title-tab"></h1>
        <input id="search" type="search" aria-label="Search">
        <div id="filters"></div>
        <div id="colors" hidden>
          <span data-i="color"></span>
          <div id="dots"></div>
        </div>
      </header>
      <div id="grid"></div>
    </div>
  </section>

  <main id="scene">
    <canvas id="view"></canvas>
    <div id="controls">
      <button data-view="body" data-i="frame_body"></button>
      <button data-view="face" data-i="frame_face"></button>
      <button data-view="turn" id="spin" data-i="spin"></button>
      <select id="expression" aria-label="Expression" hidden></select>
    </div>
    <div id="simplified" hidden data-i="simplified"></div>
    <div id="loader" hidden data-i="loading"></div>
  </main>

  <aside id="details">
    <nav id="panes">
      <button data-p="character" data-i="panel_character"></button>
      <button data-p="render" data-i="panel_render"></button>
    </nav>

    <div id="pane-character" class="pane">
      <label class="field"><span data-i="character_name"></span><input id="name" type="text" maxlength="60" autocomplete="off"></label>
      <ul id="selection"></ul>
      <details id="origins" hidden><summary data-i="origins"></summary><ul id="origins-list"></ul></details>
      <div id="warnings"></div>
      <button id="assemble" class="primary" data-i="assemble"></button>
      <p class="help" data-i="help_assemble"></p>
      <div id="work" hidden>
        <div id="step"></div>
        <div id="bar" class="bar"><div></div></div>
        <div id="result"></div>
      </div>
      <details id="refusals">
        <summary><span data-i="refused"></span> (<span id="nb-refusals">0</span>)</summary>
        <ul id="list-refusals"></ul>
      </details>
    </div>

    <div id="pane-render" class="pane" hidden>
      <div class="rank">
        <label class="field large"><span data-i="preset"></span><select id="preset"></select></label>
      </div>
      <div class="rank">
        <button id="render-import" data-i="render_import"></button>
        <button id="render-export" data-i="render_export"></button>
        <button id="render-default" data-i="render_default"></button>
        <input id="render-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="render-note" class="help"></p>
      <div id="settings"></div>
    </div>
  </aside>
</div>

<!-- Library: import models, extract their parts -->
<div id="library" class="view page" hidden>
  <div class="spine">
    <p id="missing" class="banner-note" hidden></p>
    <section class="card">
      <h2><i>1</i><span data-i="import_title"></span></h2>
      <p class="help" data-i="import_help"></p>
      <label id="drop">
        <input id="file-model" type="file" multiple hidden>
        <b data-i="drop_title"></b>
        <span id="drop-formats"></span>
      </label>
      <div id="import-state"></div>
      <div class="two">
        <div><h3 data-i="formats_input"></h3><ul id="formats-input" class="list"></ul></div>
        <div><h3 data-i="skeletons"></h3><ul id="list-skeletons" class="list"></ul></div>
      </div>
    </section>
    <section class="card">
      <h2><i>2</i><span data-i="extract_title"></span></h2>
      <p class="help" data-i="extract_help"></p>
      <div id="models"></div>
      <div class="rank" id="what">
        <label><input type="checkbox" value="face_count" checked> <span data-i="face_count"></span></label>
        <label><input type="checkbox" value="hairstyles" checked> <span data-i="hairstyles"></span></label>
        <label><input type="checkbox" value="clothes" checked> <span data-i="clothes"></span></label>
        <button id="extract" class="primary" data-i="extract"></button>
      </div>
      <div id="extraction" hidden>
        <div id="extraction-step"></div>
        <div class="rank" id="extraction-progress">
          <div class="bar" id="extraction-bar"><div></div></div>
          <button id="cancel" data-i="cancel" hidden></button>
        </div>
        <p class="help" id="extraction-server" data-i="extraction_server" hidden></p>
        <pre id="extraction-log"></pre>
      </div>
    </section>
  </div>
</div>

<!-- Characters: what was assembled, to download -->
<div id="characters" class="view page" hidden>
  <div class="spine">
    <section class="card">
      <h2><span data-i="characters_title"></span></h2>
      <p class="help" data-i="characters_help"></p>
      <ul id="formats-output" class="list inline"></ul>
      <div id="gallery"></div>
    </section>
  </div>
</div>

<canvas id="workshop-thumbnail" width="256" height="256" hidden></canvas>
<script type="module" src="/page/workshop.js"></script>
</body>
</html>
