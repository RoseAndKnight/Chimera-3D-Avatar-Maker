<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chimera 3D Avatar Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/page/chimera.svg">
<link rel="stylesheet" href="/page/style.css">
</head>
<body data-vue="creer">
<header id="bandeau">
  <a class="marque" href="/" aria-label="Chimera 3D Avatar Maker">
    <svg class="sceau" viewBox="0 0 32 32" aria-hidden="true">
      <path class="s1" d="M24.6 7.9A12 12 0 0 0 9.2 6.1"/>
      <path class="s2" d="M6.3 8.9a12 12 0 0 0 0 14.2"/>
      <path class="s3" d="M9.2 25.9a12 12 0 0 0 15.4-1.8"/>
      <circle cx="16" cy="16" r="2.6"/>
    </svg>
    <span class="nom">Chimera</span><span class="suite">3D Avatar Maker</span>
  </a>
  <nav id="vues" aria-label="Views">
    <button data-v="creer" data-i="vue_creer"></button>
    <button data-v="bibliotheque" data-i="vue_bibliotheque"></button>
    <button data-v="personnages" data-i="vue_personnages"></button>
  </nav>
  <div class="bord">
    <span id="nombres"></span>
    <button id="langue" title="Language"></button>
  </div>
</header>

<!-- Create: choose the parts, see the character, tune the render, assemble -->
<div id="creer" class="vue">
  <section id="choix">
    <nav id="onglets" aria-label="Categories"></nav>
    <div id="rayon">
      <header>
        <h1 id="titre-onglet"></h1>
        <input id="recherche" type="search" aria-label="Search">
        <div id="filtres"></div>
        <div id="couleurs" hidden>
          <span data-i="couleur"></span>
          <div id="pastilles"></div>
        </div>
      </header>
      <div id="grille"></div>
    </div>
  </section>

  <main id="scene">
    <canvas id="vue"></canvas>
    <div id="commandes">
      <button data-vue="corps" data-i="cadre_corps"></button>
      <button data-vue="visage" data-i="cadre_visage"></button>
      <button data-vue="tour" id="tourner" data-i="tourner"></button>
      <select id="expression" aria-label="Expression" hidden></select>
    </div>
    <div id="simplifie" hidden data-i="simplifie"></div>
    <div id="charge" hidden data-i="chargement"></div>
  </main>

  <aside id="fiche">
    <nav id="volets">
      <button data-p="personnage" data-i="volet_personnage"></button>
      <button data-p="rendu" data-i="volet_rendu"></button>
    </nav>

    <div id="volet-personnage" class="volet">
      <label class="champ"><span data-i="nom_personnage"></span><input id="nom" type="text" maxlength="60" autocomplete="off"></label>
      <ul id="selection"></ul>
      <details id="origines" hidden><summary data-i="origines"></summary><ul id="origines-liste"></ul></details>
      <div id="alertes"></div>
      <button id="assembler" class="principal" data-i="assembler"></button>
      <p class="aide" data-i="aide_assembler"></p>
      <div id="travail" hidden>
        <div id="etape"></div>
        <div id="barre" class="barre"><div></div></div>
        <div id="resultat"></div>
      </div>
      <details id="refus">
        <summary><span data-i="refusees"></span> (<span id="nb-refus">0</span>)</summary>
        <ul id="liste-refus"></ul>
      </details>
    </div>

    <div id="volet-rendu" class="volet" hidden>
      <div class="rang">
        <label class="champ large"><span data-i="prereglage"></span><select id="prereglage"></select></label>
      </div>
      <div class="rang">
        <button id="rendu-importer" data-i="rendu_importer"></button>
        <button id="rendu-exporter" data-i="rendu_exporter"></button>
        <button id="rendu-defaut" data-i="rendu_defaut"></button>
        <input id="rendu-fichier" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="rendu-note" class="aide"></p>
      <div id="reglages"></div>
    </div>
  </aside>
</div>

<!-- Library: import models, extract their parts -->
<div id="bibliotheque" class="vue page" hidden>
  <div class="colonne">
    <p id="manque" class="bandeau-note" hidden></p>
    <section class="carte">
      <h2><i>1</i><span data-i="importer_titre"></span></h2>
      <p class="aide" data-i="importer_aide"></p>
      <label id="depot">
        <input id="fichier-modele" type="file" multiple hidden>
        <b data-i="depot_titre"></b>
        <span id="depot-formats"></span>
      </label>
      <div id="import-etat"></div>
      <div class="deux">
        <div><h3 data-i="formats_entree"></h3><ul id="formats-entree" class="liste"></ul></div>
        <div><h3 data-i="squelettes"></h3><ul id="liste-squelettes" class="liste"></ul></div>
      </div>
    </section>
    <section class="carte">
      <h2><i>2</i><span data-i="extraire_titre"></span></h2>
      <p class="aide" data-i="extraire_aide"></p>
      <div id="modeles"></div>
      <div class="rang" id="quoi">
        <label><input type="checkbox" value="visages" checked> <span data-i="visages"></span></label>
        <label><input type="checkbox" value="coiffures" checked> <span data-i="coiffures"></span></label>
        <label><input type="checkbox" value="vetements" checked> <span data-i="vetements"></span></label>
        <button id="extraire" class="principal" data-i="extraire"></button>
      </div>
      <div id="extraction" hidden>
        <div id="extraction-etape"></div>
        <div class="rang" id="extraction-suivi">
          <div class="barre" id="extraction-barre"><div></div></div>
          <button id="annuler" data-i="annuler" hidden></button>
        </div>
        <p class="aide" id="extraction-serveur" data-i="extraction_serveur" hidden></p>
        <pre id="extraction-journal"></pre>
      </div>
    </section>
  </div>
</div>

<!-- Characters: what was assembled, to download -->
<div id="personnages" class="vue page" hidden>
  <div class="colonne">
    <section class="carte">
      <h2><span data-i="personnages_titre"></span></h2>
      <p class="aide" data-i="personnages_aide"></p>
      <ul id="formats-sortie" class="liste enligne"></ul>
      <div id="galerie"></div>
    </section>
  </div>
</div>

<canvas id="atelier-vignette" width="256" height="256" hidden></canvas>
<script type="module" src="/page/atelier.js"></script>
</body>
</html>
